<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nest in new folder</title>
    <style>
        :root { --ink:#172033; --muted:#667085; --line:#e6e9f0; --surface:#fff; --soft:#f1f4fb; --danger:#d94b5c; --accent:#625bf6; }
        html, body { margin:0; }
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size:13px; color:var(--ink); background:var(--surface);
        }
        form { padding:16px; display:flex; flex-direction:column; gap:10px; }
        h1 { margin:0; font-size:16px; }
        .label { font-size:11px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
        #entries { margin:0; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--soft); font-weight:650; word-break:break-word; max-height:120px; overflow:auto; }
        input {
            font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; color:var(--ink);
        }
        input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
        #error { margin:0; color:var(--danger); font-weight:650; }
        .actions { display:flex; justify-content:flex-end; gap:8px; }
        button {
            font:inherit; font-weight:650; color:#fff; background:var(--accent); border:0;
            border-radius:8px; padding:8px 14px; cursor:pointer;
        }
        button.ghost { color:var(--ink); background:var(--soft); }
    </style>
</head>
<body>
    <form id="nest-form">
        <h1>Nest in new folder</h1>
        <p class="label">Entries</p>
        <p id="entries">…</p>
        <label class="label" for="folder-name">Folder name</label>
        <input id="folder-name" type="text" value="New Folder" autocomplete="off">
        <p id="error" hidden></p>
        <div class="actions">
            <button type="button" class="ghost" id="cancel">Cancel</button>
            <button type="submit" id="ok">Nest</button>
        </div>
    </form>
    <script src="js/nest-entries.js"></script>
</body>
</html>

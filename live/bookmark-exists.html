<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Already bookmarked</title>
    <style>
        :root { --ink:#172033; --muted:#667085; --line:#e6e9f0; --surface:#fff; --soft:#f1f4fb; --danger:#d94b5c; --accent:#625bf6; }
        html, body { margin:0; }
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size:13px; color:var(--ink); background:var(--surface);
        }
        .sheet { padding:16px; display:flex; flex-direction:column; gap:10px; }
        h1 { margin:0; font-size:16px; color:var(--danger); }
        #error { margin:0; color:var(--ink); font-weight:650; }
        .place { padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--soft); }
        .place p { margin:0; }
        .label { font-size:11px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
        .path, .title { margin-top:2px; font-weight:650; word-break:break-word; }
        .place .path { margin-bottom:8px; }
        a.path { color:var(--accent); text-decoration:underline; cursor:pointer; }
        .actions { display:flex; justify-content:flex-end; }
        button {
            font:inherit; font-weight:650; color:#fff; background:var(--accent); border:0;
            border-radius:8px; padding:8px 14px; cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="sheet">
        <h1>This link was not bookmarked</h1>
        <p id="error">It already exists in the library.</p>
        <div id="where"></div>
        <div class="actions">
            <button type="button" id="ok">OK</button>
        </div>
    </div>
    <script src="js/bookmark-exists.js"></script>
</body>
</html>
